[package]
name = "samefn-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "PoC: one correctly rounded, versioned sin() shared by TiDB, TiKV and TiFlash"
repository = "https://github.com/mjonss/samefn-poc"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "samefn"
crate-type = ["rlib", "staticlib"]

[build-dependencies]
cc = "1"

# Applies to the archive built from this repository for TiDB and TiFlash; a crate that
# depends on this one (TiKV) uses its own profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
